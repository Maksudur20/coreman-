{% extends 'base.html' %}
{% block content %}
<main class="auth-shell">
  <div class="auth-panel">
    <p class="eyebrow accent">ADMIN ACCESS</p>
    <h1>Admin Login</h1>
    <form method="post" action="{{ url_for('admin_login') }}" class="admin-form single">
      <label>
        Username
        <input type="text" name="username" required>
      </label>
      <label>
        Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn dark">SIGN IN</button>
    </form>
  </div>
</main>
{% endblock %}
