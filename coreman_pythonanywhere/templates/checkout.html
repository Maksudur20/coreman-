{% extends 'base.html' %}{% block content %}<main class="page checkout"><h1>Checkout</h1><form method="post"><label>Name<input required name="name"></label><label>Email<input required type="email" name="email"></label><label>Phone<input required name="phone"></label><label>Delivery Address<textarea required name="address"></textarea></label><label>Payment Method<select name="payment_method"><option>Cash on Delivery</option>{% if not cod_only %}<option>bKash</option><option>Card / Online Payment</option>{% endif %}</select></label><h2>Total: ৳{{'%.0f'|format(total)}}</h2><button class="btn dark">PLACE ORDER</button></form></main>{% endblock %}
