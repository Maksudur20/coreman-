{% extends 'base.html' %}{% block content %}<main class="page"><h1>Your Cart</h1>{% if items %}<form method="post" action="/cart/update">{% for x in items %}<div class="cartrow"><img src="{{x.image}}"><div><h3>{{x.name}}</h3><p>৳{{'%.0f'|format(x.price)}} × <input class="qty" name="qty_{{x.id}}" value="{{x.qty}}" type="number" min="0"></p></div><b>৳{{'%.0f'|format(x.subtotal)}}</b></div>{% endfor %}<button class="btn">UPDATE CART</button></form><div class="total">Total: ৳{{'%.0f'|format(total)}} <a class="btn dark" href="/checkout">CHECKOUT</a></div>{% else %}<p>Your cart is empty.</p>{% endif %}</main>{% endblock %}
