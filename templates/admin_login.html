{% extends 'base.html' %}
{% block content %}
<main class="auth-shell">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--core-line); background:transparent;">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="COREMAN Icon" style="width:36px; height:36px; object-fit:contain; background:transparent;">
      <img src="{{ url_for('static', filename='coreman_wordmark.png') }}" alt="COREMAN" style="height:24px; width:auto; object-fit:contain; background:transparent;">
    </div>
    <p class="eyebrow accent" style="margin-bottom:6px;">ADMIN ACCESS</p>
    <h1 style="font-size:26px; font-weight:700; margin:0 0 10px 0; color:var(--core-ink);">Admin Portal</h1>
    <p style="font-size:12px; color:var(--core-muted); margin-bottom:24px;">Sign in to access store controls and management.</p>

    <form method="post" action="{{ url_for('admin_login') }}" class="admin-form single" style="width:280px; max-width:100%;">
      <label style="font-size:12px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; color:var(--core-muted);">
        Username
        <input type="text" name="username" class="field-input" placeholder="admin" required autofocus style="border:2px solid rgba(17,17,17,0.45); padding:15px 16px; width:100%; min-width:280px; border-radius:5px; margin-top:6px; box-sizing:border-box; font-size:14px;">
      </label>
      <label style="font-size:12px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; color:var(--core-muted); margin-top:14px;">
        Password
        <input type="password" name="password" class="field-input" placeholder="••••••••••••" required style="border:2px solid rgba(17,17,17,0.45); padding:15px 16px; width:100%; min-width:280px; border-radius:5px; margin-top:6px; box-sizing:border-box; font-size:14px;">
      </label>
      <button type="submit" class="btn dark" style="width:100%; margin-top:20px;">SIGN IN</button>
    </form>
  </div>
</main>
{% endblock %}
